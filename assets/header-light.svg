<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Krishna V. Gowda. I build systems that prove they're right. A chain of seventeen links verifies one by one.">
<style>
  .bg{fill:#edf1f5}
  .l{fill:none;stroke:#b9c2cf;stroke-width:9;stroke-linecap:round;animation:verify 9.0s infinite both}
  @keyframes verify{0%{stroke:#b9c2cf}3%,90%{stroke:#1f3bd1}97%,100%{stroke:#b9c2cf}}
.l0{animation-delay:0.00s}
.l1{animation-delay:0.22s}
.l2{animation-delay:0.44s}
.l3{animation-delay:0.66s}
.l4{animation-delay:0.88s}
.l5{animation-delay:1.10s}
.l6{animation-delay:1.32s}
.l7{animation-delay:1.54s}
.l8{animation-delay:1.76s}
.l9{animation-delay:1.98s}
.l10{animation-delay:2.20s}
.l11{animation-delay:2.42s}
.l12{animation-delay:2.64s}
.l13{animation-delay:2.86s}
.l14{animation-delay:3.08s}
.l15{animation-delay:3.30s}
.l16{animation-delay:3.52s}
  .stamp{opacity:0;transform-origin:1010px 341px;animation:stamp 9.0s infinite both;animation-delay:3.74s}
  @keyframes stamp{0%{opacity:0;transform:scale(1.7) rotate(-12deg)}4%{opacity:1;transform:scale(1) rotate(-4deg)}48%{opacity:1;transform:scale(1) rotate(-4deg)}53%,100%{opacity:0}}
  .name{font:600 22px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#566272}
  .head{font:800 58px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#0f1720;letter-spacing:-1.5px}
  .sub{font:500 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#566272}
  @media (prefers-reduced-motion:reduce){.l{animation:none;stroke:#1f3bd1}.stamp{animation:none;opacity:1}}
</style>
