<text class="name" x="72" y="218">Krishna V. Gowda</text>
<text class="head" x="72" y="282">I build systems that prove they're right.</text>
<text class="sub" x="72" y="326">Co-founder and CTO of KRIVANCE. Computer science, Bengaluru.</text>
<g class="stamp"><rect x="930" y="317" width="160" height="48" rx="12" fill="#dfe5ff" stroke="#1f3bd1" stroke-width="4"/><text x="1010" y="350" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="800" font-size="26" fill="#1f3bd1">Verified</text></g>
